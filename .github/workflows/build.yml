name: Construire FalloutMC
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle --no-daemon -p menu-mod build
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutMC-Menu
          path: menu-mod/build/libs/*.jar
          if-no-files-found: error
  windows:
    needs: [test, menu]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FalloutMC-Launcher --collect-all minecraft_launcher_lib --collect-all certifi --add-data "third-party-licenses:third-party-licenses" main.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FalloutMC-Preparer-Pack tools/build_pack.py
      - name: Construire l'installateur
        shell: pwsh
        run: |
          $Compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $Compiler)) { throw 'Compilateur Inno Setup absent du runner' }
          & $Compiler installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: FalloutMC-Menu
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: FalloutMC-Windows
          path: |
            dist/FalloutMC-Launcher.exe
            dist/FalloutMC-Preparer-Pack.exe
            dist/FalloutMC-Setup.exe
            dist/falloutmc-menu-*.jar
          if-no-files-found: error
